<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R6 Emote Viewer</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1f2330; --fg:#e6e9ef; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); overflow:hidden; }
  .app { display:flex; height:100dvh; height:100vh; }
  .panel { width:320px; background:var(--panel); border-right:1px solid #2a2f3a; padding:12px; overflow:hidden; display:flex; flex-direction:column; gap:12px; }
  .panel .card.emote-card { flex:1; display:flex; flex-direction:column; min-height:0; }
  .viewer { flex:1; position:relative; background:#0a0c10; display:flex; flex-direction:column; }
  .viewer-header { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid #2a2f3a; }
  .viewer-header h2 { margin:0; font-size:1rem; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stage { flex:1; position:relative; background:#0a0c10; }
  #canvas { width:100%; height:100%; display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; background:rgba(0,0,0,.5); color:#fff; pointer-events:none; }
  .overlay button { pointer-events:auto; }
  .viewer-info { padding:8px 12px; background:var(--panel); border-top:1px solid #2a2f3a; font-size:.8rem; color:var(--muted); }
  .viewer-controls { padding:8px 12px; background:var(--panel); border-top:1px solid #2a2f3a; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.9rem; }
  button.secondary { background:#2a2f3a; color:var(--fg); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=text], select { width:100%; background:#0f1115; color:var(--fg); border:1px solid #2a2f3a; border-radius:6px; padding:8px; font-family:inherit; }
  .card { background:var(--panel2); border:1px solid #2a2f3a; border-radius:10px; padding:12px; }
  .card h3 { margin:0 0 8px; font-size:.95rem; color:var(--fg); }
  label { display:block; font-size:.85rem; color:var(--muted); margin:6px 0 2px; }
  .stats { font-size:.8rem; color:var(--muted); line-height:1.5; }
  .stats b { color:var(--fg); }
  input[type=range] { width:100%; }
  .timeline { display:flex; align-items:center; gap:8px; }
  .timeline span { font-size:.75rem; color:var(--muted); min-width:48px; text-align:center; }
  .hud { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); padding:8px 10px; border-radius:8px; font-size:.75rem; color:#ddd; pointer-events:none; z-index:5; }
  .emote-list { flex:1; min-height:0; overflow:auto; border:1px solid #2a2f3a; border-radius:6px; }
  .emote-item { padding:8px 12px; cursor:pointer; font-size:.85rem; border-bottom:1px solid #2a2f3a; min-height:44px; display:flex; align-items:center; }
  .emote-item:hover { background:#2a2f3a; }
  .emote-item.active { background:var(--accent); color:#fff; }
  .emote-item.err { color:var(--accent2); }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid #555; border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }
  .pill { display:inline-block; background:#2a2f3a; padding:2px 8px; border-radius:999px; font-size:.75rem; margin:2px; }
  .hidden { display:none !important; }
  .screen-list, .screen-viewer { display:none; }
  .screen-list.active, .screen-viewer.active { display:flex; flex:1; min-height:0; }

  /* mobile: single screen */
  @media (max-width: 899px) {
    .app { flex-direction:column; }
    .panel { width:100%; border-right:none; border-bottom:1px solid #2a2f3a; max-height:40vh; }
    .screen-list { flex-direction:column; }
    .screen-viewer { flex-direction:column; }
    .viewer { flex:1; }
  }
  /* landscape phone: stage full */
  @media (max-width: 899px) and (max-height: 500px) {
    .viewer-header { padding:4px 8px; }
    .viewer-info, .viewer-controls { padding:4px 8px; }
  }
  /* desktop two-pane */
  @media (min-width: 900px) {
    .screen-list, .screen-viewer { display:none !important; }
    .desktop-layout { display:flex; flex:1; min-height:0; }
    .mobile-only { display:none; }
  }
  @media (max-width: 899px) {
    .desktop-layout { display:none; }
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .no-scroll { overflow:hidden; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Desktop layout -->
  <div class="desktop-layout">
    <div class="panel">
      <div class="card emote-card">
        <h3>エモート</h3>
        <input type="text" id="emoteSearch" placeholder="検索...">
        <div id="emoteStatus" class="stats" style="margin-top:6px;">一覧を取得中...</div>
        <div class="emote-list" id="emoteList"></div>
      </div>
      <div class="card">
        <h3>体型スライダー（停止中のみ有効）</h3>
        <label>高さ: <span id="hv">1.00</span></label>
        <input type="range" id="heightScale" min="0.5" max="1.5" step="0.01" value="1">
        <label>横幅: <span id="wv">1.00</span></label>
        <input type="range" id="widthScale" min="0.5" max="1.5" step="0.01" value="1">
        <label>頭: <span id="ev">1.00</span></label>
        <input type="range" id="headScale" min="0.5" max="2.0" step="0.01" value="1">
      </div>
      <div class="card">
        <h3>表示</h3>
        <label><input type="checkbox" id="showGrid" checked> グリッド</label>
        <label><input type="checkbox" id="showSkeleton" checked> ボーン線</label>
        <label><input type="checkbox" id="showJoints" checked> ジョイント表示</label>
        <label><input type="checkbox" id="autoRotate" > 自動回転</label>
      </div>
      <div class="card">
        <h3>再生コントロール</h3>
        <div class="row">
          <button id="playBtn">▶ 再生</button>
          <button id="pauseBtn" class="secondary">⏸ 一時停止</button>
          <button id="stopBtn" class="secondary">⏹ 停止</button>
        </div>
        <div class="row">
          <label style="flex:0 0 auto;">速度</label>
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <label style="flex:0 0 auto;"><input type="checkbox" id="loopChk" checked> ループ</label>
        </div>
        <div class="timeline">
          <span id="tCur">0.00</span>
          <input type="range" id="slider" min="0" max="1" step="0.001" value="0">
          <span id="tDur">0.00</span>
        </div>
      </div>
      <div class="card">
        <h3>情報</h3>
        <div class="stats" id="stats">未選択</div>
      </div>
    </div>
    <div class="viewer" id="desktopViewer">
      <canvas id="canvas"></canvas>
      <div id="emptyGuide" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;">エモートを選んでください</div>
      <!-- controls moved to left panel -->
      <div class="overlay" id="overlayReady" style="display:none;">
        <button id="overlayPlayBtn">▶ 再生</button>
      </div>
      <div class="overlay" id="overlayLoading" style="display:none;">
        <div class="spinner"></div><span>読み込み中</span>
      </div>
      <div class="overlay" id="overlayError" style="display:none;">
        <span id="overlayErrorText"></span>
        <button id="overlayRetryBtn">再試行</button>
      </div>
    </div>
  </div>

  <!-- Mobile layout -->
  <div class="screen-list mobile-only" id="screenList">
    <div class="panel" style="width:100%;border-right:none;">
      <div class="card">
        <h3>エモート</h3>
        <input type="text" id="emoteSearchM" placeholder="検索...">
        <div id="emoteStatusM" class="stats" style="margin-top:6px;">一覧を取得中...</div>
        <div class="emote-list" id="emoteListM"></div>
      </div>
    </div>
  </div>
  <div class="screen-viewer mobile-only" id="screenViewer">
    <div class="viewer-header">
      <button id="backBtnM" class="secondary">← 戻る</button>
      <h2 id="viewerTitleM">—</h2>
      <button id="prevBtnM" class="secondary">◀</button>
      <button id="nextBtnM" class="secondary">▶▶</button>
    </div>
    <div class="stage" id="mobileStage">
      <div class="overlay" id="overlayReadyM" style="display:none;"><button id="overlayPlayBtnM">▶ 再生</button></div>
      <div class="overlay" id="overlayLoadingM" style="display:none;"><div class="spinner"></div><span>読み込み中</span></div>
      <div class="overlay" id="overlayErrorM" style="display:none;"><span id="overlayErrorTextM"></span><button id="overlayRetryBtnM">再試行</button></div>
    </div>
    <div class="viewer-info" id="viewerInfoM"></div>
    <div class="viewer-controls" id="viewerControlsM">
      <div class="row">
        <button id="playBtnM">▶ 再生</button>
        <button id="pauseBtnM" class="secondary">⏸ 一時停止</button>
        <button id="stopBtnM" class="secondary">⏹ 停止</button>
      </div>
      <div class="timeline">
        <span id="tCurM">0.00</span>
        <input type="range" id="sliderM" min="0" max="1" step="0.001" value="0">
        <span id="tDurM">0.00</span>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PEACH = 0xffcc99, GREY = 0x8a8a8a, BLUE = 0x3366cc, ROOTC = 0x555555;

// ---------- shape helpers ----------
function bboxSize(shape, dims) {
  switch (shape) {
    case 'box': return [dims[0], dims[1], dims[2]];
    case 'sphere': { const r=dims[0]; return [2*r, 2*r, 2*r]; }
    case 'cylinder': case 'frustum': {
      const arr = dims.length === 2 ? [dims[0],dims[0],dims[1]] : dims;
      const r = Math.max(arr[0], arr[1]); return [2*r, arr[2], 2*r];
    }
    case 'capsule': { const [r,h]=dims; return [2*r, h+2*r, 2*r]; }
    default: return [1,1,1];
  }
}
function makeGeometry(shape, dims) {
  switch (shape) {
    case 'box': return new THREE.BoxGeometry(dims[0], dims[1], dims[2]);
    case 'sphere': return new THREE.SphereGeometry(dims[0], 16, 16);
    case 'cylinder': {
      const arr = dims.length === 2 ? [dims[0],dims[0],dims[1]] : dims;
      return new THREE.CylinderGeometry(arr[0], arr[1], arr[2], 16);
    }
    case 'capsule': { const [r,h] = dims; return new THREE.CapsuleGeometry(r, h, 8, 16); }
    case 'frustum': {
      const arr = dims.length === 2 ? [dims[0],dims[0],dims[1]] : dims;
      return new THREE.CylinderGeometry(arr[0], arr[1], arr[2], 16);
    }
    default: return new THREE.BoxGeometry(1,1,1);
  }
}
function applyScales(shape, dims, partKey, scales) {
  const h = scales.height, w = scales.width, hd = scales.head;
  const isHead = (partKey === 'head');
  const headMul = isHead ? hd : 1;
  switch (shape) {
    case 'box': return [dims[0]*w*headMul, dims[1]*h*headMul, dims[2]*w*headMul];
    case 'sphere': { const r = dims[0] * (isHead ? hd : (w+h)/2); return [r]; }
    case 'cylinder': case 'frustum': {
      const arr = dims.slice();
      if (arr.length === 2) return [arr[0]*w*headMul, arr[0]*w*headMul, arr[1]*h*headMul];
      return [arr[0]*w*headMul, arr[1]*w*headMul, arr[2]*h*headMul];
    }
    case 'capsule': { const [r,len] = dims; return [r*w*headMul, len*h*headMul]; }
    default: return dims.slice();
  }
}

// ---------- rig definitions ----------
function joint(name, parent, child, pn, cn) {
  return { name, parent, child, parentNorm: pn.slice(), childNorm: cn.slice() };
}
const R6_PARTS_BASE = {
  root:    { name:'Root',     shape:'box', dimensions:[0.6,0.6,0.6], color:ROOTC, parent:null },
  torso:   { name:'Torso',    shape:'box', dimensions:[2.0,2.0,1.0], color:GREY, parent:'root' },
  head:    { name:'Head',     shape:'box', dimensions:[1.2,1.2,1.2], color:PEACH, parent:'torso' },
  leftarm: { name:'Left Arm', shape:'box', dimensions:[1.0,2.0,1.0], color:PEACH, parent:'torso' },
  rightarm:{ name:'Right Arm',shape:'box', dimensions:[1.0,2.0,1.0], color:PEACH, parent:'torso' },
  leftleg: { name:'Left Leg', shape:'box', dimensions:[1.0,2.0,1.0], color:BLUE, parent:'torso' },
  rightleg:{ name:'Right Leg',shape:'box', dimensions:[1.0,2.0,1.0], color:BLUE, parent:'torso' },
};
const R6_JOINTS_NORM = [
  joint('RootJoint','root','torso', [0,0,0], [0,0,0]),
  joint('Neck','torso','head', [0,0.5,0], [0,-0.5,0]),
  joint('LeftShoulder','torso','leftarm', [-0.5,0.5,0], [0.5,0.5,0]),
  joint('RightShoulder','torso','rightarm', [0.5,0.5,0], [-0.5,0.5,0]),
  joint('LeftHip','torso','leftleg', [-0.25,-0.5,0], [0,0.5,0]),
  joint('RightHip','torso','rightleg', [0.25,-0.5,0], [0,0.5,0]),
];
const R6_ORDER = ['root','torso','head','leftarm','rightarm','leftleg','rightleg'];
const RIGS = { R6: { parts: R6_PARTS_BASE, joints: R6_JOINTS_NORM, partOrder: R6_ORDER } };

const PRESETS = { Standard: { scales: { height:1, width:1, head:1 }, R6: {}, extra: { R6: [] } } };
const PRESET_LEGACY_MAP = { Girl:'Standard', Boy:'Standard', Kid:'Standard', Slim:'Standard', Broad:'Standard' };

const ALIAS = { R6: { root:'root', humanoidrootpart:'root', hrp:'root', rootpart:'root', torso:'torso', head:'head', leftarm:'leftarm', leftshoulder:'leftarm', 'left arm':'leftarm', rightarm:'rightarm', rightshoulder:'rightarm', 'right arm':'rightarm', leftleg:'leftleg', lefthip:'leftleg', 'left leg':'leftleg', rightleg:'rightleg', righthip:'rightleg', 'right leg':'rightleg' } };
const ALIAS_R15 = { root:'root', humanoidrootpart:'root', hrp:'root', rootpart:'root', lowertorso:'lowertorso', uppertorso:'uppertorso', torso:'uppertorso', head:'head', leftupperarm:'leftupperarm', leftlowerarm:'leftlowerarm', lefthand:'lefthand', rightupperarm:'rightupperarm', rightlowerarm:'rightlowerarm', righthand:'righthand', leftupperleg:'leftupperleg', leftlowerleg:'leftlowerleg', leftfoot:'leftfoot', rightupperleg:'rightupperleg', rightlowerleg:'rightlowerleg', rightfoot:'rightfoot' };
function normKey(s){ return String(s).toLowerCase().replace(/[\s_\-]/g,''); }
function aliasLookup(rigType, name) {
  const map = (rigType === 'R15') ? ALIAS_R15 : (ALIAS[rigType] || ALIAS.R6);
  const n = normKey(name);
  if (map[n]) return map[n];
  const rig = RIGS.R6;
  if (rig.parts[n]) return n;
  for (const key in rig.parts) { if (n.includes(key) || key.includes(n)) return key; }
  return null;
}
const POSE_MAP_R15_TO_R6 = { root:'root', lowertorso:'torso', uppertorso:'torso', head:'head', leftupperarm:'leftarm', leftlowerarm:'leftarm', lefthand:'leftarm', rightupperarm:'rightarm', rightlowerarm:'rightarm', righthand:'rightarm', leftupperleg:'leftleg', leftlowerleg:'leftleg', leftfoot:'leftleg', rightupperleg:'rightleg', rightlowerleg:'rightleg', rightfoot:'rightleg' };

// ---------- scene ----------
const canvas = document.getElementById('canvas');
let renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(8, 5, 10);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.enableDamping = true;
const ambient = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(5,10,7); scene.add(dir);
const dir2 = new THREE.DirectionalLight(0x88aaff, 0.3); dir2.position.set(-5,5,-7); scene.add(dir2);
const grid = new THREE.GridHelper(20,20,0x333344,0x222233); scene.add(grid);
const axes = new THREE.AxesHelper(2); scene.add(axes);
const rigContainer = new THREE.Group(); scene.add(rigContainer);

// ---------- state ----------
let currentRig = 'R6';
let currentPreset = 'Standard';
let bodyScale = { height:1, width:1, head:1 };

let PARTS = null, JOINTS = null, PART_ORDER = null;
let groups = {}, meshes = {}, jointMarkers = [], skelLines = {};
const skelMat = new THREE.LineBasicMaterial({color:0xffd166, opacity:0.9, transparent:true});

// ---------- app state ----------
const state = { screen: 'list', status: 'idle', selectedName: null, selectedData: null, frames: [], duration: 0, elapsed: 0, playing: false, error: null, ignoredParts: [] };
const REQUIRED_PARTS = ['Torso','Head','Left Arm','Right Arm','Left Leg','Right Leg'];
const partNameToKey = { 'Torso':'torso', 'Head':'head', 'Left Arm':'leftarm', 'Right Arm':'rightarm', 'Left Leg':'leftleg', 'Right Leg':'rightleg' };
const keyToPartName = { 'torso':'Torso', 'head':'Head', 'leftarm':'Left Arm', 'rightarm':'Right Arm', 'leftleg':'Left Leg', 'rightleg':'Right Leg' };

let emoteList = [];
let emoteCache = {};
let ignoredParts = [];
let playing = false;
let elapsed = 0;
let speed = 1;
let loop = true;
let duration = 0;
let frames = [];
let restPose = {};
let emotePlaying = false;
let baseRootPos = new THREE.Vector3(0,0,0);
let baseRootQuat = new THREE.Quaternion();
let playbackRootPos = new THREE.Vector3(0,0,0);
let playbackRootQuat = new THREE.Quaternion();
let sliderUpdating = false;
let needsRender = true;
let renderCount = 0;

const autoPlayKey = 'emote_autoplay';
function getAutoPlay() { try { const v = localStorage.getItem(autoPlayKey); if (v === 'true') return true; if (v === 'false') return false; } catch(e){} return false; }
function setAutoPlay(v) { try { localStorage.setItem(autoPlayKey, v ? 'true' : 'false'); } catch(e){} }

// ---------- coord transform ----------
function robloxToApp(cf) { return cf.slice(); }
function cfToPosQuat(cf) {
  const pos = new THREE.Vector3(cf[0], cf[1], cf[2]);
  const m = new THREE.Matrix4();
  m.set(cf[3], cf[4], cf[5], 0, cf[6], cf[7], cf[8], 0, cf[9], cf[10], cf[11], 0, 0,0,0,1);
  const q = new THREE.Quaternion();
  q.setFromRotationMatrix(m);
  return { pos, quat: q };
}

// ---------- build model ----------
function resolvePartSpec(base, presetOverride, scales) {
  const shape = (presetOverride && presetOverride.shape) || base.shape;
  const dims0 = (presetOverride && presetOverride.dimensions) ? presetOverride.dimensions.slice() : base.dimensions.slice();
  const color = (presetOverride && presetOverride.color != null) ? presetOverride.color : base.color;
  const dims = applyScales(shape, dims0, base.key || '', scales);
  const size = bboxSize(shape, dims);
  return { key: base.key, name: base.name, shape, dimensions: dims, color, size };
}
function buildModel(rigType, presetName, scales) {
  while (rigContainer.children.length) {
    const c = rigContainer.children[0];
    rigContainer.remove(c);
    const disposeOne = (o) => { if (o.geometry && o.geometry.dispose) o.geometry.dispose(); if (o.material) { if (Array.isArray(o.material)) o.material.forEach(m => { if (m.dispose) m.dispose(); }); else if (o.material.dispose) o.material.dispose(); } };
    disposeOne(c);
    if (c.children) c.children.forEach(ch => disposeOne(ch));
  }
  groups = {}; meshes = {}; jointMarkers = []; skelLines = {};
  PARTS = {}; JOINTS = []; PART_ORDER = [];
  const preset = PRESETS[presetName] || PRESETS.Standard;
  const finalScales = { height: scales.height * (preset.scales ? preset.scales.height : 1), width: scales.width * (preset.scales ? preset.scales.width : 1), head: scales.head * (preset.scales ? preset.scales.head : 1) };
  const baseRig = RIGS[rigType];
  const partDefs = {};
  const partParent = {};
  const partOrder = baseRig.partOrder.slice();
  for (const key of baseRig.partOrder) {
    const base = baseRig.parts[key];
    const override = (preset[rigType] || {})[key];
    const spec = resolvePartSpec({ key, name: base.name, shape: base.shape, dimensions: base.dimensions, color: base.color }, override, finalScales);
    partDefs[key] = spec;
    partParent[key] = base.parent;
  }
  const extras = (preset.extra && preset.extra[rigType]) ? preset.extra[rigType] : [];
  for (const ex of extras) {
    const spec = resolvePartSpec({ key: ex.key, name: ex.key, shape: ex.shape, dimensions: ex.dimensions, color: ex.color }, null, finalScales);
    partDefs[ex.key] = spec;
    partParent[ex.key] = ex.parent;
    partOrder.push(ex.key);
    partDefs[ex.key]._attach = ex;
  }
  const joints = baseRig.joints.map(j => ({...j, parentNorm: j.parentNorm.slice(), childNorm: j.childNorm.slice()}));
  for (const ex of extras) {
    joints.push({ name: 'Extra_' + ex.key, parent: ex.parent, child: ex.key, parentNorm: ex.attachNorm.slice(), childNorm: [0, 0.5, 0] });
  }
  const sphereGeo = new THREE.SphereGeometry(0.07, 12, 12);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
  for (const key of partOrder) {
    const def = partDefs[key];
    const g = new THREE.Group();
    const geo = makeGeometry(def.shape, def.dimensions);
    const mat = new THREE.MeshStandardMaterial({color:def.color, roughness:0.6, metalness:0.1});
    const mesh = new THREE.Mesh(geo, mat);
    const edges = new THREE.EdgesGeometry(geo);
    const eline = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x000000, opacity:0.4, transparent:true}));
    const jMesh = new THREE.Mesh(sphereGeo, sphereMat);
    g.add(mesh); g.add(eline); g.add(jMesh);
    jointMarkers.push(jMesh);
    if (key === 'root') { mesh.visible = false; eline.visible = false; }
    const parentKey = partParent[key];
    if (parentKey && partDefs[parentKey]) {
      const jnt = joints.find(j => j.child === key);
      const parentSize = partDefs[parentKey].size;
      const pp = [jnt.parentNorm[0]*parentSize[0], jnt.parentNorm[1]*parentSize[1], jnt.parentNorm[2]*parentSize[2]];
      g.position.set(pp[0], pp[1], pp[2]);
      groups[parentKey].add(g);
    } else {
      rigContainer.add(g);
      g.position.set(0,0,0);
    }
    groups[key] = g;
    meshes[key] = mesh;
    const childSize = def.size;
    let childNorm = [0,0,0];
    if (parentKey && partDefs[parentKey]) {
      const jnt = joints.find(j => j.child === key);
      childNorm = jnt.childNorm;
    }
    const cp = [childNorm[0]*childSize[0], childNorm[1]*childSize[1], childNorm[2]*childSize[2]];
    const meshOff = [-cp[0], -cp[1], -cp[2]];
    mesh.position.set(meshOff[0], meshOff[1], meshOff[2]);
    eline.position.copy(mesh.position);
    PARTS[key] = { key, name: def.name, shape: def.shape, dimensions: def.dimensions, color: def.color, size: def.size, parent: parentKey, meshOff: meshOff };
  }
  for (const j of joints) {
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const l = new THREE.Line(geo, skelMat);
    rigContainer.add(l);
    skelLines[j.name] = { line: l, parent: j.parent, child: j.child };
  }
  JOINTS = joints;
  PART_ORDER = partOrder;
  currentRig = rigType;
  // rigLabel display removed (Standard only)
}

// ---------- rest pose ----------
function resetPose() {
  for (const key of PART_ORDER) {
    const def = PARTS[key];
    if (def.parent) {
      const jnt = JOINTS.find(j => j.child === key);
      const parentSize = PARTS[jnt.parent].size;
      const pp = [jnt.parentNorm[0]*parentSize[0], jnt.parentNorm[1]*parentSize[1], jnt.parentNorm[2]*parentSize[2]];
      groups[key].position.set(pp[0], pp[1], pp[2]);
    } else {
      groups[key].position.set(0,0,0);
    }
    groups[key].quaternion.identity();
  }
  adjustGround();
  updateSkel();
}
function captureRestPose() {
  restPose = {};
  for (const key of PART_ORDER) {
    const wp = new THREE.Vector3(); groups[key].getWorldPosition(wp);
    restPose[key] = { pos: wp.clone(), quat: groups[key].quaternion.clone() };
  }
}
function adjustGround() {
  rigContainer.position.y = 0;
  rigContainer.updateMatrixWorld(true);
  let minY = Infinity;
  for (const key in meshes) {
    if (key.includes('leg') || key.includes('foot')) {
      const box = new THREE.Box3().setFromObject(meshes[key]);
      minY = Math.min(minY, box.min.y);
    }
  }
  // detailed log
  for (const key in meshes) {
    if (key.includes('leg')) {
      const b = new THREE.Box3().setFromObject(meshes[key]);
      console.log('[EmoteViewer] leg', key, 'meshWorldMinY=', b.min.y, 'maxY=', b.max.y);
    }
  }
  rigContainer.position.y = (isFinite(minY) && minY < 0) ? -minY : 0;
  // adjustGround done
}
function updateSkel() {
  for (const name in skelLines) {
    const { line, parent, child } = skelLines[name];
    const pa = new THREE.Vector3(); groups[parent].getWorldPosition(pa);
    const pb = new THREE.Vector3(); groups[child].getWorldPosition(pb);
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, pa.x, pa.y, pa.z);
    pos.setXYZ(1, pb.x, pb.y, pb.z);
    pos.needsUpdate = true;
  }
}

// ---------- emote parse ----------
const INTERNAL_PARTS = ['HumanoidRootPart'];
function parseEmoteFrames(data) {
  const frames = data.frames || data.keyframes || [];
  const interval = data.interval || 0.1;
  const out = [];
  frames.forEach((f, i) => {
    const t = (f.t != null) ? f.t : (f.time != null ? f.time : i * interval);
    const parts = f.parts || f.bones || {};
    const converted = {};
    for (const [name, arr] of Object.entries(parts)) {
      if (REQUIRED_PARTS.indexOf(name) === -1 && INTERNAL_PARTS.indexOf(name) === -1) continue;
      converted[name] = arr.slice(0,12).map(Number);
    }
    out.push({ t: Number(t), parts: converted });
  });
  out.sort((a,b) => a.t - b.t);
  return out;
}

// ---------- sample emote ----------
function sampleEmote(t) {
  const result = {};
  if (!frames.length) return result;
  if (!isFinite(t)) return result;
  if (frames.length === 1) {
    const f = frames[0];
    const rootCf = f.parts['HumanoidRootPart'] ? robloxToApp(f.parts['HumanoidRootPart']) : [0,0,0,1,0,0,0,1,0,0,0,1];
    const rootT = cfToPosQuat(rootCf);
    const finalRootPos = rootT.pos.clone().applyQuaternion(baseRootQuat).add(baseRootPos);
    const finalRootQuat = baseRootQuat.clone().multiply(rootT.quat);
    playbackRootPos.copy(finalRootPos);
    playbackRootQuat.copy(finalRootQuat);
    for (const pname of REQUIRED_PARTS) {
      const cf = f.parts[pname];
      if (!cf) continue;
      const c = robloxToApp(cf);
      const tr = cfToPosQuat(c);
      const worldPos = tr.pos.clone().applyQuaternion(rootT.quat).add(rootT.pos);
      const worldQuat = rootT.quat.clone().multiply(tr.quat);
      const finalPos = worldPos.clone().applyQuaternion(baseRootQuat).add(baseRootPos);
      const finalQuat = baseRootQuat.clone().multiply(worldQuat);
      result[pname] = { pos: finalPos, quat: finalQuat };
    }
    return result;
  }
  let tt = t;
  if (tt < frames[0].t) tt = frames[0].t;
  if (tt > frames[frames.length-1].t) tt = frames[frames.length-1].t;
  let i = 0;
  for (; i < frames.length - 2; i++) {
    if (tt >= frames[i].t && tt <= frames[i+1].t) break;
  }
  const a = frames[i], b = frames[i+1];
  const span = b.t - a.t;
  const alpha = span > 0 ? (tt - a.t) / span : 0;
  const rootA = a.parts['HumanoidRootPart'] ? cfToPosQuat(robloxToApp(a.parts['HumanoidRootPart'])) : { pos: new THREE.Vector3(0,0,0), quat: new THREE.Quaternion() };
  const rootB = b.parts['HumanoidRootPart'] ? cfToPosQuat(robloxToApp(b.parts['HumanoidRootPart'])) : { pos: new THREE.Vector3(0,0,0), quat: new THREE.Quaternion() };
  const rootPos = rootA.pos.clone().lerp(rootB.pos, alpha);
  const rootQuat = rootA.quat.clone().slerp(rootB.quat, alpha);
  const finalRootPos = rootPos.clone().applyQuaternion(baseRootQuat).add(baseRootPos);
  const finalRootQuat = baseRootQuat.clone().multiply(rootQuat);
  playbackRootPos.copy(finalRootPos);
  playbackRootQuat.copy(finalRootQuat);
  for (const pname of REQUIRED_PARTS) {
    const ca = a.parts[pname], cb = b.parts[pname];
    if (!ca || !cb) continue;
    const ta = cfToPosQuat(robloxToApp(ca));
    const tb = cfToPosQuat(robloxToApp(cb));
    const pos = ta.pos.clone().lerp(tb.pos, alpha);
    const quat = ta.quat.clone().slerp(tb.quat, alpha);
    const worldPos = pos.clone().applyQuaternion(rootQuat).add(rootPos);
    const worldQuat = rootQuat.clone().multiply(quat);
    const finalPos = worldPos.clone().applyQuaternion(baseRootQuat).add(baseRootPos);
    const finalQuat = baseRootQuat.clone().multiply(worldQuat);
    result[pname] = { pos: finalPos, quat: finalQuat };
  }
  return result;
}

// ---------- emote manifest ----------
const EMBEDDED_MANIFEST = ["AlterEgo","BangBangBang","Bling-Bang-Bang-Born","Calamel Dancen","Catch my heart","Fright Funk","Gangnam Style","Hai Yorokonde","Iris Out","Koi dance","Linga Guli Guli","Low Coltisol","Magnetic","Mesmerizer","Motagem Hikari","Motagem Xonada","Oddloop","PoPiPo","PokeDance","Ronald Insanity","Sunday Morning","Tears","TikiTiki","Tokyo Ichi Ni San","Unlock it","Yuji Jumping","bibbidiba","hakari","kemusan","otukare summer","scenario"];
const CACHE_KEY = 'emote_manifest_v1';
const CACHE_TTL = 3600000;
function loadCachedManifest() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.items) || !obj.time) return null;
    if (Date.now() - obj.time > CACHE_TTL) return null;
    return obj.items;
  } catch (e) { return null; }
}
function saveCachedManifest(items) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ items, time: Date.now() })); } catch (e) {}
}
async function fetchManifest() {
  const status = document.getElementById('emoteStatus');
  const statusM = document.getElementById('emoteStatusM');
  const cached = loadCachedManifest();
  if (cached) { emoteList = cached; renderManifest(); if (status) status.textContent = cached.length + '件 (cache)'; if (statusM) statusM.textContent = cached.length + '件 (cache)'; return; }
  if (status) status.innerHTML = '<span class="spinner"></span> 一覧を取得中...';
  if (statusM) statusM.innerHTML = '<span class="spinner"></span> 一覧を取得中...';
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    const res = await fetch('https://api.github.com/repos/doihi/json-emote-list/contents/?ref=main', { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const items = data.filter(x => x.type === 'file' && /\.json$/i.test(x.name))
      .map(x => ({ name: x.name.replace(/\.json$/i, ''), url: x.download_url }));
    items.sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    saveCachedManifest(items);
    emoteList = items;
    renderManifest();
    if (status) status.textContent = items.length + '件';
    if (statusM) statusM.textContent = items.length + '件';
  } catch (e) {
    console.warn('[EmoteViewer] manifest fetch failed, using embedded:', e);
    const items = EMBEDDED_MANIFEST.map(n => ({ name: n, url: null }));
    emoteList = items;
    renderManifest();
    if (status) status.textContent = 'オフライン一覧 (' + items.length + '件)';
    if (statusM) statusM.textContent = 'オフライン一覧 (' + items.length + '件)';
  }
}
function renderManifest() {
  filterEmoteList();
  filterEmoteListM();
}
function filterEmoteList() {
  const q = (document.getElementById('emoteSearch')?.value || '').toLowerCase();
  const container = document.getElementById('emoteList');
  if (!container) return;
  container.innerHTML = '';
  const filtered = emoteList.filter(e => e.name.toLowerCase().includes(q));
  for (const e of filtered) {
    const div = document.createElement('div');
    div.className = 'emote-item' + (e.name === state.selectedName ? ' active' : '') + (e.error ? ' err' : '');
    div.textContent = e.name + (e.error ? ' ⚠ ' + e.error : '');
    div.onclick = () => openViewer(e.name);
    container.appendChild(div);
  }
}
function filterEmoteListM() {
  const q = (document.getElementById('emoteSearchM')?.value || '').toLowerCase();
  const container = document.getElementById('emoteListM');
  if (!container) return;
  container.innerHTML = '';
  const filtered = emoteList.filter(e => e.name.toLowerCase().includes(q));
  for (const e of filtered) {

    div.onclick = () => openViewer(e.name);

// ---------- fetch with abort ----------
let currentAbort = null;
let requestToken = 0;
async function fetchEmote(name) {
  const entry = emoteList.find(e => e.name === name);
  if (entry && entry.data) return entry.data;
  if (currentAbort) currentAbort.abort();
  currentAbort = new AbortController();
  const url = (entry && entry.url) ? entry.url : 'https://raw.githubusercontent.com/doihi/json-emote-list/main/' + encodeURIComponent(name) + '.json';
  const res = await fetch(url, { signal: currentAbort.signal });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (entry) { entry.data = data; entry.error = null; }
  return data;
}

// ---------- open viewer ----------
async function openViewer(name) {
  state.selectedName = name;
  state.status = 'loading';
  state.error = null;
  ignoredParts = [];
  setState('viewer', 'loading');
  const token = requestToken + 1;
  requestToken = token;
  try {
    const data = await fetchEmote(name);
    if (token !== requestToken) { return; }
    const rawFrames = data.frames || data.keyframes || [];
    if (!rawFrames.length) throw new Error('フレームなし');
    const partSets = new Set();
    for (const f of rawFrames) { const parts = f.parts || f.bones || {}; for (const k in parts) partSets.add(k); }
    for (const rp of REQUIRED_PARTS) { if (!partSets.has(rp)) throw new Error('必須パーツ欠け: ' + rp); }
    ignoredParts = [...partSets].filter(p => REQUIRED_PARTS.indexOf(p) === -1 && INTERNAL_PARTS.indexOf(p) === -1);
    if (ignoredParts.length) console.warn('[EmoteViewer] 未対応パーツ（無視）:', ignoredParts.join(', '));
    state.selectedData = data;
    state.frames = parseEmoteFrames(data);
    state.duration = state.frames.length ? state.frames[state.frames.length-1].t : 0;
    if (state.duration <= 0) state.duration = 1;
    duration = state.duration;
    frames = state.frames;
    elapsed = 0;
    state.elapsed = 0;
    emotePlaying = false;
    playing = false;
    bodyScale = { height:1, width:1, head:1 };
    document.getElementById('heightScale').value = 1;
    document.getElementById('widthScale').value = 1;
    document.getElementById('headScale').value = 1;
    document.getElementById('hv').textContent = '1.00';
    document.getElementById('wv').textContent = '1.00';
    document.getElementById('ev').textContent = '1.00';
    document.getElementById('heightScale').disabled = true;
    document.getElementById('widthScale').disabled = true;
    document.getElementById('headScale').disabled = true;
    for (const k in skelLines) skelLines[k].line.visible = false;
    jointMarkers.forEach(m => m.visible = false);
    buildModel(currentRig, currentPreset, bodyScale);
    resetPose();
    adjustGround();
    updateSkel();
    captureRestPose();
    const bp = new THREE.Vector3(); groups['root'].getWorldPosition(bp);
    const bq = new THREE.Quaternion(); groups['root'].getWorldQuaternion(bq);
    baseRootPos.copy(bp); baseRootQuat.copy(bq);
    updatePoseEmote(0);
    if (getAutoPlay()) { state.status = 'playing'; playing = true; emotePlaying = true; }
    else { state.status = 'ready'; }
    setState('viewer', state.status);
    updateUI();
    fitCamera();
  } catch (e) {
    console.error('[OPENVIEWER ERROR]', e);
    if (token !== requestToken) { return; }
    state.status = 'error';
    state.error = e.message;
    const entry = emoteList.find(x => x.name === name);
    if (entry) entry.error = e.message;
    setState('viewer', 'error');
    renderEmoteListAll();
  }
}

function closeViewer() {
  // stop playback
  playing = false;
  emotePlaying = false;
  frames = [];
  // restore scales
  bodyScale = { height:1, width:1, head:1 };
  document.getElementById('heightScale').disabled = false;
  document.getElementById('widthScale').disabled = false;
  document.getElementById('headScale').disabled = false;
  // restore joints/skeleton
  const sk = document.getElementById('showSkeleton').checked;
  const jt = document.getElementById('showJoints').checked;
  for (const k in skelLines) skelLines[k].line.visible = sk;
  jointMarkers.forEach(m => m.visible = jt);
  // rebuild rest
  buildModel(currentRig, currentPreset, bodyScale);
  resetPose();
  adjustGround();
  updateSkel();
  captureRestPose();
  state.selectedName = null;
  state.selectedData = null;
  state.status = 'idle';
  setState('list', 'idle');
  updateHash();
  needsRender = true;
}

function renderEmoteListAll() { filterEmoteList(); filterEmoteListM(); }

// ---------- playback ----------
function updatePoseEmote(t) {
  if (emotePlaying && frames.length) {
    const sample = sampleEmote(t);
    rigContainer.position.y = 0;
    for (const key of PART_ORDER) {
      const def = PARTS[key];
      const pname = keyToPartName[key];
      let desiredPos, desiredQuat;
      if (pname && sample[pname]) {
        desiredPos = sample[pname].pos.clone();
        desiredQuat = sample[pname].quat.clone();
      } else if (key === 'root') {
        desiredPos = playbackRootPos.clone();
        desiredQuat = playbackRootQuat.clone();
      } else if (restPose[key]) {
        desiredPos = restPose[key].pos.clone();
        desiredQuat = restPose[key].quat.clone();
      } else {
        desiredPos = new THREE.Vector3(0,0,0);
        desiredQuat = new THREE.Quaternion();
      }
      const meshOff = new THREE.Vector3(def.meshOff[0], def.meshOff[1], def.meshOff[2]);
      const rotatedOff = meshOff.clone().applyQuaternion(desiredQuat);
      const desiredGroupPos = desiredPos.clone().sub(rotatedOff);
      let parentPos = new THREE.Vector3(0,0,0);
      let parentQuat = new THREE.Quaternion();
      if (def.parent && groups[def.parent]) {
        groups[def.parent].getWorldPosition(parentPos);
        groups[def.parent].getWorldQuaternion(parentQuat);
      }
      const invQ = parentQuat.clone().invert();
      const localPos = desiredGroupPos.sub(parentPos).applyQuaternion(invQ);
      const localQuat = invQ.clone().multiply(desiredQuat);
      groups[key].position.copy(localPos);
      groups[key].quaternion.copy(localQuat);
    }
    updateSkel();
    return;
  }
  // rest mode
  for (const key of PART_ORDER) {
    const def = PARTS[key];
    if (def.parent) {
      const jnt = JOINTS.find(j => j.child === key);
      const parentSize = PARTS[jnt.parent].size;
      const pp = [jnt.parentNorm[0]*parentSize[0], jnt.parentNorm[1]*parentSize[1], jnt.parentNorm[2]*parentSize[2]];
      groups[key].position.set(pp[0], pp[1], pp[2]);
    } else {
      groups[key].position.set(0,0,0);
    }
    groups[key].quaternion.identity();
  }
  adjustGround();
  updateSkel();
}
function play() {
  if (state.status !== 'ready' && state.status !== 'paused') return;
  playing = true;
  emotePlaying = true;
  state.status = 'playing';
  setState(state.screen, 'playing');
  needsRender = true;
}
function pause() {
  if (state.status !== 'playing') return;
  playing = false;
  state.status = 'paused';
  setState(state.screen, 'paused');
}
function stop() {
  if (!emotePlaying) return;
  playing = false;
  elapsed = 0;
  state.elapsed = 0;
  updatePoseEmote(0);
  state.status = 'ready';
  setState(state.screen, 'ready');
  updateUI();
  needsRender = true;
}
function seek(t) {
  elapsed = t;
  state.elapsed = t;
  updatePoseEmote(t);
  updateUI();
  needsRender = true;
}

if (overlayPlayBtnM) overlayPlayBtnM.onclick = () => play();
const overlayRetryBtn = document.getElementById('overlayRetryBtn');
const overlayRetryBtnM = document.getElementById('overlayRetryBtnM');
if (overlayRetryBtn) overlayRetryBtn.onclick = () => { if (state.selectedName) openViewer(state.selectedName); };
if (overlayRetryBtnM) overlayRetryBtnM.onclick = () => { if (state.selectedName) openViewer(state.selectedName); };

const speedSel = document.getElementById('speed');
if (speedSel) speedSel.onchange = (e) => { speed = parseFloat(e.target.value); };
const loopChk = document.getElementById('loopChk');
if (loopChk) loopChk.onchange = (e) => { loop = e.target.checked; };
const showGrid = document.getElementById('showGrid');
if (showGrid) showGrid.onchange = (e) => { grid.visible = e.target.checked; needsRender=true; };
const showSkeleton = document.getElementById('showSkeleton');
if (showSkeleton) showSkeleton.onchange = (e) => { if (!emotePlaying) for (const k in skelLines) skelLines[k].line.visible = e.target.checked; };
const showJoints = document.getElementById('showJoints');
if (showJoints) showJoints.onchange = (e) => { if (!emotePlaying) jointMarkers.forEach(m => m.visible = e.target.checked); };
const autoRotate = document.getElementById('autoRotate');
if (autoRotate) autoRotate.onchange = (e) => { autoRot = e.target.checked; };
function wireSlider(id) {
  const sl = document.getElementById(id);
  if (sl) {
    sl.oninput = (e) => {
      if (sliderUpdating) return;
      if (!emotePlaying) return;
      seek(parseFloat(e.target.value));
    };
  }
}
wireSlider('slider');
wireSlider('sliderM');
const backBtnM = document.getElementById('backBtnM');
if (backBtnM) backBtnM.onclick = () => closeViewer();
const prevBtnM = document.getElementById('prevBtnM');
const nextBtnM = document.getElementById('nextBtnM');
if (prevBtnM) prevBtnM.onclick = () => navigateEmote(-1);
if (nextBtnM) nextBtnM.onclick = () => navigateEmote(1);

function navigateEmote(dir) {
  if (!emoteList.length) return;
  const idx = emoteList.findIndex(x => x.name === state.selectedName);
  let ni = (idx < 0 ? 0 : idx) + dir;
  if (ni < 0) ni = emoteList.length - 1;
  if (ni >= emoteList.length) ni = 0;
  openViewer(emoteList[ni].name);
}
// desktop prev/next buttons? add to header? We'll add via keyboard only for now; mobile has buttons.

// hash routing
function updateHash() {
  if (state.screen === 'viewer' && state.selectedName) {
    location.hash = '#/emote/' + encodeURIComponent(state.selectedName);
  } else {
    location.hash = '';
  }
}
function handleHash() {
  const m = location.hash.match(/^#\/emote\/(.+)$/);
  if (m) {
    const name = decodeURIComponent(m[1]);
    openViewer(name);
  }
}
window.addEventListener('hashchange', handleHash);

// auto play setting
const autoPlayChk = document.getElementById('autoPlayChk');
// (no checkbox in UI by default; use localStorage only)
// We'll add a small toggle in info? Skip; default off.

// search
const es = document.getElementById('emoteSearch');
if (es) es.oninput = filterEmoteList;
const esm = document.getElementById('emoteSearchM');
if (esm) esm.oninput = filterEmoteListM;

// sliders
function onScaleChange() {
  if (emotePlaying) return;
  bodyScale.height = parseFloat(document.getElementById('heightScale').value);
  bodyScale.width = parseFloat(document.getElementById('widthScale').value);
  bodyScale.head = parseFloat(document.getElementById('headScale').value);
  document.getElementById('hv').textContent = bodyScale.height.toFixed(2);
  document.getElementById('wv').textContent = bodyScale.width.toFixed(2);
  document.getElementById('ev').textContent = bodyScale.head.toFixed(2);
  buildModel(currentRig, currentPreset, bodyScale);
  resetPose();
  adjustGround();
  updateSkel();
  captureRestPose();
  needsRender = true;
}
const hs = document.getElementById('heightScale');
const ws = document.getElementById('widthScale');
const hes = document.getElementById('headScale');
if (hs) hs.oninput = onScaleChange;
if (ws) ws.oninput = onScaleChange;
if (hes) hes.oninput = onScaleChange;

// keyboard
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); if (state.status === 'playing') pause(); else if (state.status === 'ready' || state.status === 'paused') play(); }
  else if (e.code === 'Escape') { e.preventDefault(); if (state.status === 'playing' || state.status === 'paused') stop(); else if (state.screen === 'viewer') closeViewer(); }
  else if (e.code === 'ArrowLeft') { if (state.screen === 'viewer') navigateEmote(-1); }
  else if (e.code === 'ArrowRight') { if (state.screen === 'viewer') navigateEmote(1); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); /* list nav handled by focus */ }
  else if (e.code === 'ArrowDown') { e.preventDefault(); }
});

// ---------- canvas parenting ----------
function ensureCanvasParent() {
  const c = document.getElementById('canvas');
  const isMobile = window.innerWidth < 900;
  let target = document.getElementById('desktopViewer');
  if (isMobile && state.screen === 'viewer') target = document.getElementById('mobileStage');
  if (c.parentElement !== target) {
    target.insertBefore(c, target.firstChild);
  }
}
// ---------- resize ----------
function resize() {
  const c = document.getElementById('canvas');
  const rect = c.parentElement.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    renderer.setSize(rect.width, rect.height, false);
    camera.aspect = rect.width / rect.height;
    camera.updateProjectionMatrix();
  }
  needsRender = true;
}
if (typeof ResizeObserver !== 'undefined') {
  const ro = new ResizeObserver(() => { resize(); });
  ro.observe(document.getElementById('desktopViewer'));
  ro.observe(document.getElementById('mobileStage'));
} else {
  window.addEventListener('resize', resize);
}
// mobile canvas
// single canvas, reparented via ensureCanvasParent()

// ---------- camera fit ----------
function fitCamera() {
  // compute bounding box of meshes
  const box = new THREE.Box3();
  for (const key in meshes) {
    const b = new THREE.Box3().setFromObject(meshes[key]);
    box.union(b);
  }
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * Math.PI / 180;
  let cameraZ = maxDim / (2 * Math.tan(fov / 2));
  cameraZ *= 1.6;
  camera.position.set(center.x + cameraZ * 0.6, center.y + cameraZ * 0.3, center.z + cameraZ * 0.8);
  controls.target.copy(center);
  controls.update();
  needsRender = true;
}

// ---------- pointer events for touch ----------
let pointerDown = false;
let lastPointer = null;
canvas.addEventListener('pointerdown', (e) => { pointerDown = true; lastPointer = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointermove', (e) => { if (!pointerDown) return; /* orbit controls handles */ });
canvas.addEventListener('pointerup', () => { pointerDown = false; });
canvas.addEventListener('pointercancel', () => { pointerDown = false; });

// ---------- render loop ----------
let autoRot = false;
let lastTime = performance.now();
let rafId = null;
function animate() {
  rafId = requestAnimationFrame(animate);
  console.log('[ANIM] playing=', playing, 'emotePlaying=', emotePlaying, 'frames=', frames.length, 'status=', state.status);
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  if (document.hidden) return;
  const isMobile = window.innerWidth < 900;
  if (isMobile && state.screen === 'list') return;
  // only render when needed
  let shouldRender = needsRender;
  if (playing && emotePlaying && frames.length) {
    if (!isFinite(elapsed)) elapsed = 0;
    let dtc = dt;
    if (!isFinite(dtc) || dtc < 0) dtc = 0;
    if (dtc > 0.25) dtc = 0.25;
    elapsed += dtc * speed;
    if (loop) {
      if (elapsed > duration) elapsed = elapsed % duration;
    } else {
      if (elapsed >= duration) { elapsed = duration; playing = false; state.status = 'paused'; setState(state.screen, 'paused'); }
    }
    updatePoseEmote(elapsed);
    state.elapsed = elapsed;
    updateUI();
    shouldRender = true;
  }
  if (autoRot) { scene.rotation.y += dt * 0.3; shouldRender = true; }
  if (shouldRender) {
    controls.update();
    renderer.render(scene, camera);
    needsRender = false;
    renderCount++;
  }
}
// start loop
rafId = requestAnimationFrame(animate);



// ---------- visibility ----------
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // pause RAF? We'll just skip rendering; loop continues but no render
  } else {
    needsRender = true;
    lastTime = performance.now();
  }
});

// ---------- webgl context loss ----------
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); console.warn('WebGL context lost'); });
canvas.addEventListener('webglcontextrestored', () => {
  console.log('WebGL context restored');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  // rebuild
  buildModel(currentRig, currentPreset, bodyScale);
  resetPose();
  if (emotePlaying) updatePoseEmote(elapsed);
  else { adjustGround(); updateSkel(); }
  needsRender = true;
});

// ---------- init ----------
buildModel(currentRig, currentPreset, bodyScale);
resetPose();
captureRestPose();
adjustGround();
updateSkel();
needsRender = true;

applyState();

// hash
if (typeof location !== 'undefined') handleHash();
fetchManifest();

// expose updateUI
function updateUI() {
  for (const id of ['slider','sliderM']) {
    const slider = document.getElementById(id);
    if (slider) {
      slider.max = duration || 1;
      sliderUpdating = true;
      slider.value = elapsed;
      sliderUpdating = false;
    }
  }
  for (const id of ['tCur','tCurM']) {
    const el = document.getElementById(id);
    if (el) el.textContent = elapsed.toFixed(2);
  }
  for (const id of ['tDur','tDurM']) {
    const el = document.getElementById(id);
    if (el) el.textContent = (duration || 0).toFixed(2);
  }
}
